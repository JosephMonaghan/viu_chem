[project]
name = "viu-chem"
version = "0.1.81"
description = "Collection of commonly used functions by VIU chemistry"
authors = [
    {name = "Joseph Monaghan",email = "Joseph_Monaghan@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "pyimzml (>=1.5.5,<2.0.0)",
    "pymzml (>=2.5.11,<3.0.0)",
    "numpy (>=2.2.3,<3.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "matplotlib (>=3.10.0,<4.0.0)",
    "imzml-writer (>=1.2.7,<2.0.0)",
    "scipy (>=1.15.3,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
]

[project.optional-dependencies]
coregistration = [
    "spatialdata >=0.8,<0.9",
    "anndata >=0.13.2,<0.14",
    "zarr >=3.1.4,<3.2",
    "ome-zarr >=0.16,<0.19",
    "dask >=2026.3,<2026.8",
    "xarray >=2024.10,<2027",
    "napari",
    "simpleitk",
    "pydantic >=2.11.5,<2.13",
    "npe2 == 0.8.1",
    "magicgui",
    "imageio",
    "tifffile >=2022.8.12",
    "geopandas",
    "shapely",
    "QtPy",
    "PyQt5",
    "thyra >=3.7.4,<4",
    "defusedxml",
    "umap-learn >=0.5.12,<0.6",
    "tqdm >=4.66,<5",
]

[tool.poetry]
packages = [{include = "viu_chem", from = "src"}]

# Optional dependencies go in the main dependency table:
[tool.poetry.dependencies]


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
sphinx = "^8.2.3"
sphinx-autobuild = "^2024.10.3"
sphinx-autodoc-typehints = "^3.2.0"
sphinx-rtd-theme = "^3.0.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
